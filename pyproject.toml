[project]
name = "superphoto"
version = "0.1.0"
description = "Diagnose a photograph, apply parametric master-look recipes, learn from your picks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "numpy>=2.0",
  "pillow>=11.0",
  "pydantic-settings>=2.6",
  "openai>=1.60",
  "python-dotenv>=1.0",
  "exifread>=3.0",
  "httpx>=0.27",
  "pywebview>=5.4",
  "cryptography>=42",
]

[project.optional-dependencies]
raw = ["rawpy>=0.24"]
semantic = [
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.45",
]
dev = ["pytest>=8.3"]

[project.scripts]
superphoto = "superphoto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superphoto"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "superphoto/web"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
